name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史与标签，才能在 Release 说明里生成「本次变更」列表
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 环境自检
        run: |
          node -v
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"

      - name: 安装依赖
        run: npm ci

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          # 只缓存「下载产物」与 wrapper 发行包。
          # 之前缓存整个 ~/.gradle/caches 会把 daemon 日志、文件锁一并打包，
          # 导致 post 步骤出现 `/usr/bin/tar failed with exit code 2`。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: "gradle-${{ runner.os }}-${{ hashFiles('mobile-rn/android/**/*.gradle*', 'mobile-rn/android/gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 类型体检
        run: npm run type-check

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.STORYLOOM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 STORYLOOM_KEYSTORE_BASE64，本次使用调试签名（仅适合临时测试：无法覆盖安装，且部分手机的安全检测会拦截）"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/storyloom.keystore"
          echo "签名密钥已就绪，$(( $(stat -c%s "$RUNNER_TEMP/storyloom.keystore") )) 字节"

      - name: 构建可安装 APK
        env:
          STORYLOOM_RELEASE_STORE_FILE: ${{ runner.temp }}/storyloom.keystore
          STORYLOOM_RELEASE_STORE_PASSWORD: ${{ secrets.STORYLOOM_STORE_PASSWORD }}
          STORYLOOM_RELEASE_KEY_ALIAS: ${{ secrets.STORYLOOM_KEY_ALIAS }}
          STORYLOOM_RELEASE_KEY_PASSWORD: ${{ secrets.STORYLOOM_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleStandalone --no-daemon --stacktrace

      - name: 列出产物
        if: always()
        run: find android/app/build/outputs -name "*.apk" -printf "%s %p\n" || true

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: Storyloom-apk
          if-no-files-found: error
          retention-days: 30
          path: mobile-rn/android/app/build/outputs/apk/standalone/*.apk

      - name: 发布到 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/standalone/*.apk "$OUT/Storyloom-Android.apk"
          ls -lh "$OUT/Storyloom-Android.apk"
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v0.1.*' HEAD^ 2>/dev/null || echo "")
          {
            echo "## 安装"
            echo
            echo "下载下方的 **Storyloom-Android.apk** 直接安装，无需解压。"
            echo
            echo "| 项目 | 说明 |"
            echo "| --- | --- |"
            echo "| 包名 | \`com.meeko529.storyloom\`，可与官方 OpenFicM 共存 |"
            echo "| 首次启动 | 零下载，直接进入应用 |"
            echo "| 升级 | 签名已固定，可直接覆盖安装 |"
            echo
            echo "## 首次使用"
            echo
            echo "应用不内置模型。打开后进入 **设置 → 模型与供应商**，选择一个服务商（如智谱）并填入自己的 API Key，再添加一个模型即可开始写作。"
            echo
            echo "安装被手机安全机制拦下、或模型配置遇到问题，见 [安装与常见问题](https://github.com/Meeko529/Storyloom/blob/main/docs/安装与常见问题.md)。"
            echo
            echo "## 本次变更"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty="- %s" "$PREV_TAG"..HEAD | head -40
            else
              echo "- 首次构建"
            fi
            echo
            echo "> 完整变更历史见 [CHANGELOG](https://github.com/Meeko529/Storyloom/blob/main/CHANGELOG.md)。"
            echo
            echo "---"
            echo
            echo "签名证书 SHA-256：\`EA:B4:3A:19:25:D9:B3:6D:6D:FB:2D:59:BD:40:A9:7C:24:FF:AB:D2:C6:07:12:00:50:62:68:56:73:07:68:E7\`"
          } > "$OUT/notes.md"
          gh release create "$TAG" \
            --title "Storyloom $TAG" \
            --target "$GITHUB_SHA" \
            --notes-file "$OUT/notes.md" \
            "$OUT/Storyloom-Android.apk"
