name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 环境自检
        run: |
          node -v
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"

      - name: 安装依赖
        run: npm ci

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          # 只缓存「下载产物」与 wrapper 发行包。
          # 之前缓存整个 ~/.gradle/caches 会把 daemon 日志、文件锁一并打包，
          # 导致 post 步骤出现 `/usr/bin/tar failed with exit code 2`。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: "gradle-${{ runner.os }}-${{ hashFiles('mobile-rn/android/**/*.gradle*', 'mobile-rn/android/gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 类型体检
        run: npm run type-check

      - name: 构建可安装 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleStandalone --no-daemon --stacktrace

      - name: 列出产物
        if: always()
        run: find android/app/build/outputs -name "*.apk" -printf "%s %p\n" || true

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: Storyloom-apk
          if-no-files-found: error
          retention-days: 30
          path: mobile-rn/android/app/build/outputs/apk/standalone/*.apk

      - name: 发布到 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/standalone/*.apk "$OUT/Storyloom-Android.apk"
          ls -lh "$OUT/Storyloom-Android.apk"
          {
            echo "自动构建产物，代码提交 ${GITHUB_SHA}。"
            echo
            echo "手机安装：直接点下面的 Storyloom-Android.apk 下载即可，不需要解压。"
            echo
            echo "包名 com.meeko529.storyloom，可与官方版共存。首次启动需要联网拉取运行资源（约 225MB）。"
          } > "$OUT/notes.md"
          gh release create "$TAG" \
            --title "Storyloom $TAG" \
            --notes-file "$OUT/notes.md" \
            "$OUT/Storyloom-Android.apk"
