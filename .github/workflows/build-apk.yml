name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史与标签，才能在 Release 说明里生成「本次变更」列表
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 环境自检
        run: |
          node -v
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"

      - name: 安装依赖
        run: npm ci

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          # 只缓存「下载产物」与 wrapper 发行包。
          # 之前缓存整个 ~/.gradle/caches 会把 daemon 日志、文件锁一并打包，
          # 导致 post 步骤出现 `/usr/bin/tar failed with exit code 2`。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: "gradle-${{ runner.os }}-${{ hashFiles('mobile-rn/android/**/*.gradle*', 'mobile-rn/android/gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 类型体检
        run: npm run type-check

      - name: 注入版本号
        run: |
          # versionName 面向用户（与 Release 标签一致）；
          # versionCode 暂固定为 1 —— 与 v0.1.7（可正常安装的版本）完全一致，
          # 用于验证「versionCode 由 1 变为 1013」是否就是安装被拦的原因。
          VERSION_CODE=1
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          # 注意：本 job 的默认工作目录已是 mobile-rn（见 defaults.run.working-directory），
          # 因此这里用相对 mobile-rn 的路径，不能写成 mobile-rn/android/...
          sed -i "s/^\( *\)versionCode [0-9]*/\1versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/^\( *\)versionName \".*\"/\1versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          echo "版本号 → ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.STORYLOOM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 STORYLOOM_KEYSTORE_BASE64，本次使用调试签名（仅适合临时测试：无法覆盖安装，且部分手机的安全检测会拦截）"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/storyloom.keystore"
          echo "签名密钥已就绪，$(( $(stat -c%s "$RUNNER_TEMP/storyloom.keystore") )) 字节"

      - name: 构建可安装 APK
        env:
          STORYLOOM_RELEASE_STORE_FILE: ${{ runner.temp }}/storyloom.keystore
          STORYLOOM_RELEASE_STORE_PASSWORD: ${{ secrets.STORYLOOM_STORE_PASSWORD }}
          STORYLOOM_RELEASE_KEY_ALIAS: ${{ secrets.STORYLOOM_KEY_ALIAS }}
          STORYLOOM_RELEASE_KEY_PASSWORD: ${{ secrets.STORYLOOM_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleStandalone --no-daemon --stacktrace

      - name: 列出产物
        if: always()
        run: find android/app/build/outputs -name "*.apk" -printf "%s %p\n" || true

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: Storyloom-apk
          if-no-files-found: error
          retention-days: 30
          path: mobile-rn/android/app/build/outputs/apk/standalone/*.apk

      - name: 发布到 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/standalone/*.apk "$OUT/Storyloom-Android.apk"
          ls -lh "$OUT/Storyloom-Android.apk"
          # 本 job 的工作目录是 mobile-rn，git 命令需显式指向仓库根，
          # 否则 git log 会自动只统计 mobile-rn 子目录的提交，漏掉根目录的改动。
          PREV_TAG=$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 --match 'v0.1.*' HEAD^ 2>/dev/null || echo "")
          {
            echo "## 本次变更"
            echo
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git -C "$GITHUB_WORKSPACE" log --no-merges --pretty="- %s" "$PREV_TAG"..HEAD \
                | grep -vE '^- (docs|ci|chore|test|style|refactor)(\(|:)' \
                | grep -vE '^- (feat|fix)\((ci|docs|chore)\)' \
                | sed -E 's/^- feat(\([^)]*\))?: /- [新增] /; s/^- fix(\([^)]*\))?: /- [修复] /' \
                | head -40)
              if [ -n "$CHANGES" ]; then
                echo "$CHANGES"
              else
                echo "- 本版未包含用户可见的功能变化"
              fi
            else
              echo "- 首次发布"
            fi
          } > "$OUT/notes.md"
          gh release create "$TAG" \
            --title "Storyloom $TAG" \
            --target "$GITHUB_SHA" \
            --notes-file "$OUT/notes.md" \
            "$OUT/Storyloom-Android.apk"
